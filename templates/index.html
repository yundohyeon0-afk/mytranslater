<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글자 수 세기 - 공백 포함/제외 글자수 계산기</title>
  <meta name="description" content="글자 수, 공백 제외 글자 수, 단어 수, 바이트를 무료로 바로 세어주는 글자 수 세기 사이트입니다.">
  <!-- 구글 인증 태그는 여기에 붙여넣기 -->
  <style>
    body { font-family: sans-serif; background: #f4f6fb; margin: 0; padding: 20px; color: #222; }
    main { max-width: 700px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; }
    textarea { width: 100%; height: 220px; font-size: 16px; padding: 12px; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; }
    button { margin-top: 12px; width: 100%; padding: 14px; font-size: 18px; background: #2563eb; color: white; border: none; border-radius: 10px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .result { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .box { background: #eef2ff; padding: 16px; border-radius: 10px; text-align: center; }
    .num { font-size: 28px; font-weight: bold; color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <h1>글자 수 세기</h1>
    <p>아래 칸에 글을 넣고 버튼을 누르세요.</p>
    <form method="POST">
      <label for="text" class="sr-only">글 입력</label>
      <textarea id="text" name="text" placeholder="여기에 글을 입력하세요...">{{ text }}</textarea>
      <button type="submit">글자 수 세기</button>
    </form>
    {% if result %}
    <section class="result" aria-live="polite">
      <div class="box"><div>공백 포함</div><div class="num">{{ result.with_space }}</div></div>
      <div class="box"><div>공백 제외</div><div class="num">{{ result.no_space }}</div></div>
      <div class="box"><div>단어 수</div><div class="num">{{ result.words }}</div></div>
      <div class="box"><div>바이트</div><div class="num">{{ result.bytes }}</div></div>
    </section>
    {% endif %}
  </main>
</body>
</html>
